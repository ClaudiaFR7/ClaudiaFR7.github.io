<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Práctica 4 - Circunferencias y arcos</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>
<body>
<script>
function setup() {
  createCanvas(400, 400);
  background(255);


  // Solo dibujamos los contornos.
  noFill();
  stroke(0);
  strokeWeight(3);


  // Cara.
  fill(255,232,28);
  circle(200, 200, 350);


  // ojos.
  fill(0,0,0);
  circle(125, 170, 75);
  circle(275, 170, 75);


  // Sonrisa
  noFill();
  arc(200, 230, 180, 180, 0, PI);


  // Cejas.
  arc(270, 150, 120, 120, 0-HALF_PI, 0);
  arc(130, 150, 120, 120, PI, 0-HALF_PI);
}
</script>
</body>
</html>
