<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Práctica 2 - Colores aleatorios</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>
<body>
  <script>
    function setup() {
      createCanvas(800, 800);
      background(194, 237, 194);
      strokeWeight(4);

      // Cada lado recibe un color aleatorio.
      stroke(random(250), random(250), random(250));
      line(50, 100, 200, 100);
      line(50, 100, 50, 600);
      line(50, 600, 200, 600);
    
      

      stroke(random(255), random(255), random(255));
      line(300, 100, 450, 100);
      line(300, 100, 300, 600);
      line(300, 250, 450, 250)

      stroke(random(255), random(255), random(255));
      line(550, 100, 700, 100);
      line(550, 100, 550, 600);
      line(700, 100, 700, 250);
      line(550, 250, 700, 250);
      line(550, 250, 700, 600)

  
    }
  </script>
</body>
</html>
