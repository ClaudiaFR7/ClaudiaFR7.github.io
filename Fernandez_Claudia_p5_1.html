<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Práctica 1 - Líneas y colores</title>
  <!-- Cargamos la biblioteca p5.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>
<body>
  <!-- A partir de aquí escribimos nuestro programa -->
  <script>
    function setup() {
      createCanvas(400, 400);
      background(255);

      // Lado superior: rojo opaco, grosor 3 (modificado a grosor 6 y color azul verdoso).
      stroke(0, 200, 200);
      strokeWeight(6);
      line(50, 80, 300, 80);

      // Lado derecho: verde semitransparente, grosor 6 (modificado a grosor 5 y color rojo casi transparente).
      stroke(200, 0, 0, 50);
      strokeWeight(5);
      line(300, 80, 300, 330);

      // Lado inferior: azul opaco, grosor 2 (modificado a grosor 3 y color lila).
      stroke(50, 0, 50);
      strokeWeight(3);
      line(50, 330, 300, 330);

      // Lado izquierdo: gris, grosor 4 (modificado a grosor 2 y color verde).
      stroke(0, 120, 0,);
      strokeWeight(2);
      line(50, 80, 50, 330);
    }
  </script>
</body>
</html>
