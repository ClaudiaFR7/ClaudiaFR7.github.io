<title>Suma</title> 
</head> 
<body> 
<script> 

  //DEFINO VARIABLES// 

 let lado; 
 let volumenCubo; 

  

  //PIDO VALORES AL USUSARIO// 

lado=prompt("Dame el valor del lado de tu cubo"); 

  

  //COMBIERTO EN FLOAT// 

 lado=parseFloat(lado); 


  

  //HAGO LA OPERACION QUE ME DA LA GANA// 

 volumenCubo=(lado*lado*lado)
  

 alert("El voluen de tu cubo es: " + volumenCubo); 

document.write("<h1>El volumen de tu cubo es: " + volumenCubo + "</h1>");

</script >
</body> 
</html>
