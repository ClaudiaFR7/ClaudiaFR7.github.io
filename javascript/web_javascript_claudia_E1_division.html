<html> 

<head> 

<title>División</title> 
</head> 
<body> 
<script> 

  //DEFINO VARIABLES// 

 let dividendo; 
 let divisor; 
 let division; 

  

  //PIDO VALORES AL USUSARIO// 

dividendo=prompt("Dame un dividendo cualquiera"); 
divisor=prompt("Dame un divisor cualquiera"); 

  

  //COMBIERTO EN FLOAT// 

 dividendo=parseFloat(dividendo); 
 divisor=parseFloat(divisor); 

  

  //HAGO LA OPERACION QUE ME DA LA GANA// 

division=dividendo/divisor

  

 alert("El resultado de la división es: " + division); 

document.write("<h1>El resultado de tu división es: " + division + "</h1>");

</script >
</body> 
</html>
