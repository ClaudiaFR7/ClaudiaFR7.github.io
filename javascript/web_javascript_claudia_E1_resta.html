<html> 

<head> 

<title>Resta</title> 
</head> 
<body> 
<script> 

  //DEFINO VARIABLES// 

 let minuendo; 
 let sustraendo; 
 let resta; 

  

  //PIDO VALORES AL USUSARIO// 

minuendo=prompt("Dame un minuendo cualquiera"); 
sustraendo=prompt("Dame un sustraendo cualquiera"); 

  

  //COMBIERTO EN FLOAT// 

 minuendo=parseFloat(minuendo); 
 sustraendo=parseFloat(sustraendo); 

  

  //HAGO LA OPERACION QUE ME DA LA GANA// 

 resta=minuendo-sustraendo 

  

 alert("El resultado de la resta es: " + resta); 

document.write("<h1>El resultado de tu resta es: " + resta + "</h1>");

</script 
</body> 
</html>
