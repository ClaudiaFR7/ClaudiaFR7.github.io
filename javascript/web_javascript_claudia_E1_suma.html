<html> 

<head> 

<title>Suma</title> 

  

  
  
 </head> 
 
 <body> 

 <script> 

  //DEFINO VARIABLES// 

 let sumando_1; 

 let sumando_2; 

 let suma; 

  

  //PIDO VALORES AL USUSARIO// 

 sumando_1=prompt("Dame un sumando cualquiera"); 

 sumando_2=prompt("Dame un sumando cualquiera"); 

  

  //COMBIERTO EN FLOAT// 

 sumando_1=parseFloat(sumando_1); 

 sumando_2=parseFloat(sumando_2); 

  

  //HAGO LA OPERACION QUE ME DA LA GANA// 

 suma=sumando_1+sumando_2 

  

 alert("El resultado de la suma es: " + suma); 

 document.writer("<h1>El resultado de tu suma es: " + suma+ "</h1>"); 

 </script 

 </body> 

 </html>
