<!DOCTYPE html>

    <html lang="es">

    <head>

        <meta charset="UTF-8">

        <title>Ejercicio 09 — Heladería</title>

    </head>

    <body>

        <h1>Ejercicio 09 — Heladería</h1>

        <p>En este ejercicio el usuario elige tamaño, sabor y topping de un helado, y el programa calcula el precio final.</p>

        <script>

var precioTotal = 0;

// Tamaño
var tamanio = prompt("Escoja un tamaño (pequeño 1€, mediano 2€, grande 3€)");

if (tamanio == "pequeño") {
    precioTotal += 1;
} else if (tamanio == "mediano") {
    precioTotal += 2;
} else if (tamanio == "grande") {
    precioTotal += 3;
} else {
    document.write("<p>Tamaño no válido</p>");
}

// Sabor
var sabor = prompt("Escoja un sabor (fresa, vainilla, chocolate, pistacho, turron, avellana)");

switch (sabor) {
    case "fresa":
    case "vainilla":
    case "chocolate":
        break;
    case "pistacho":
    case "turron":
    case "avellana":
        precioTotal += 1;
        break;
    default:
        document.write("<p>No hay ese sabor</p>");
        precioTotal = 0;
}

// Toppings (uno por simplicidad)
var topping = prompt("Escoja un topping (oreo, sirope, kinder, kitkat, vainilla, galleta)");

switch (topping) {
    case "galleta":
    case "vainilla":
    case "sirope":
        precioTotal += 0.3;
        break;
    case "kinder":
    case "oreo":
    case "kitkat":
        precioTotal += 0.5;
        break;
    default:
        document.write("<p>No hay ese topping</p>");
        precioTotal = 0;
}

// Resultado
document.write("<h1>El precio final es: " + precioTotal + " €</h1>");

            
        </script>
<img src="../imagenes/helado.jpg" width="300">
    </body>

    </html>
