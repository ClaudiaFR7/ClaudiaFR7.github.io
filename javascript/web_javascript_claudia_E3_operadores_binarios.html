 <!DOCTYPE html>
    <html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Ejercicio 03 — Operadores binarios</title>
    </head>
    <body>

        <h1>Ejercicio 03 — Operadores binarios</h1>

        <script>
    var A = 10;
    var B = 20;

    var multiplica = A * B;
    var divide = A / B;
    var suma = A + B;
    var resta = A - B;

document.write("<p>El resultado de dividir " + A + " entre " + B + " es " + multiplica + "</p>");
document.write("<p>El resultado de dividir " + A + " entre " + B + " es " + divide + "</p>");
document.write("<p>El resultado de dividir " + A + " entre " + B + " es " + suma + "</p>");
document.write("<p>El resultado de dividir " + A + " entre " + B + " es " + resta + "</p>");

  
    var iguales = A==B;
    var diferentes = A!=B; 
    var mayor = A>B;
    var menor = A<B;



document.write("<p> ¿Es " + A + " igual que " + B + "? " + iguales + "</p>");
document.write("<p>¿Es diferente " + A + " de " + B + "? " + diferentes + "</p>");
document.write("<p>¿Es " + A + " mayor que " + B + "? " + mayor + "</p>");
document.write("<p>¿Es " + A + " menor que " + B + "?n" + menor + "</p>");

</script>

    </body>
    </html>
