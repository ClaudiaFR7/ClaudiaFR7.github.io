<html>
<head>
  <title>Conversión Pulgadas a Centímetros</title>
</head>
<body>
<script>

// DEFINO VARIABLES //

let numeroPulgadas;
let numeroCentimetros;

// PIDO VALORES AL USUARIO //

numeroPulgadas = prompt("Introduce la cantidad de pulgadas que quieres convertir a centímetros");

// CONVIERTO EN FLOAT //

numeroPulgadas = parseFloat(numeroPulgadas);

// HAGO LA CONVERSION //

numeroCentimetros = numeroPulgadas * 2.54;

// MUESTRO EL RESULTADO //

alert("El resultado es: " + numeroCentimetros + " cm");

document.write("<h1>" + numeroPulgadas + " pulgadas son " + numeroCentimetros + " centímetros</h1>");

</script>
</body>
</html>
