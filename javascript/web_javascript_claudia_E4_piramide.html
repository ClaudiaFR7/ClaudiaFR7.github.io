<html> 

<head> 

<title>Volumen pirámide</title> 
</head> 
<body> 
<script> 

  //DEFINO VARIABLES// 

 let anchura; 
 let altura;
  let profundidad;
 let volumenPiramide; 

  

  //PIDO VALORES AL USUSARIO// 

anchura=prompt("Introduce la anchura de tu pirámide"); 
altura=prompt("Introduce la altura de tu pirámide"); 
profundidad=prompt("Introduce la profundidad de tu pirámide");
  

  //COMBIERTO EN FLOAT// 

 anchura=parseFloat(anchura);
  altura=parseFloat(altura);
profundidad=parseFloat(profundidad);

  

  //HAGO LA OPERACION // 

 volumenPiramide=((anchura * altura* profundidad)/3);
  

 alert("El volumen de tu pirámide es: " + volumenPiramide); 

document.write("<h1>El volumen de tu pirámide es: " + volumenPiramide + "</h1>");

</script >
</body> 
</html>
