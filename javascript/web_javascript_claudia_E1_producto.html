<html> 

<head> 

<title>Multiplicación</title> 
</head> 
<body> 
<script> 

  //DEFINO VARIABLES// 

 let factor_1; 
 let factor_2; 
 let multiplicacion; 

  

  //PIDO VALORES AL USUSARIO// 

factor_1=prompt("Dame un factor cualquiera"); 
factor_2=prompt("Dame un factor cualquiera"); 

  

  //COMBIERTO EN FLOAT// 

 factor_1=parseFloat(factor_1); 
 factor_2=parseFloat(factor_2); 

  

  //HAGO LA OPERACION QUE ME DA LA GANA// 

 multiplicacion=factor_1*factor_2 

  

 alert("El resultado de la multiplicación es: " + multiplicacion); 

document.write("<h1>El resultado de tu multiplicación es: " + multiplicacion + "</h1>");

</script 
</body> 
</html>
