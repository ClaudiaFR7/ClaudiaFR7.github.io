<html> 

<head> 

<title>Algoritmia a Javascript. Condicional básico para evaluar el resultado de un cálculo</title> 
</head> 
<body> 
<script> 


  

let nota1;
let nota2;
let nota3;
let promedio;
  
nota1 = prompt("Inserte su primera nota"); 
nota2 = prompt("Inserte su segunda nota"); 
nota3 = prompt("Inserte su tercera nota"); 
  
  
nota1 = parseFloat(nota1); 
nota2 = parseFloat(nota2); 
nota3 = parseFloat(nota3); 
promedio = parseFloat(promedio);

promedio=(nota1 + nota2 + nota3)/3;

  if(promedio>=5){
alert("Asignatura aprobada");
}
else{
alert("Asignatura suspensa");
}

   document.write("<h1>Su media final es de " + promedio + "</h1>");

</script >
</body> 
</html>
