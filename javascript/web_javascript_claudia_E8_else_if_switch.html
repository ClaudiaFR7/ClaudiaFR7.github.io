<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 08 — else if y switch</title>
</head>
<body>

<script>

// ======================
// PARTE 1
// ======================
document.write("<h2>Parte 1</h2>");

var respuesta = prompt("¿Has hecho los deberes?");

if (respuesta == "si") {
    document.write("<p>Muy bien</p>");
} else if (respuesta == "no") {
    document.write("<p>Deberías hacerlos</p>");
} else {
    document.write("<p>Responde correctamente</p>");
}


// ======================
// PARTE 2
// ======================
document.write("<h2>Parte 2 - Ejercicio 1</h2>");

let numero = prompt("Ingresa un número:");

if (numero > 0) {
    document.write("<p>El número es positivo</p>");
} else if (numero < 0) {
    document.write("<p>El número es negativo</p>");
} else {
    document.write("<p>El número es cero</p>");
}


// EJERCICIO 2
document.write("<h2>Ejercicio 2</h2>");

let contraseña = prompt('Ingresa tu contraseña:');

if (contraseña === "secreto123") {
    document.write("<p>Contraseña correcta</p>");
} else {
    document.write("<p>Contraseña incorrecta</p>");
}


// EJERCICIO 3
document.write("<h2>Ejercicio 3</h2>");

let valor = null;

if (valor === null) {
    document.write("<p>El valor es nulo</p>");
} else {
    document.write("<p>El valor no es nulo</p>");
}


// EJERCICIO 4
document.write("<h2>Ejercicio 4</h2>");

let num = parseInt(prompt("Ingresa un número:"));

if (num > 0 && num % 2 === 0) {
    document.write("<p>Es positivo y par</p>");
} else if (num > 0 && num % 2 !== 0) {
    document.write("<p>Es positivo e impar</p>");
} else {
    document.write("<p>No es positivo</p>");
}


// ======================
// PARTE 3 - HELADOS
// ======================
document.write("<h2>Helados con else if</h2>");

var topping = prompt("Topping: oreo, kitkat, brownie, lacasitos");
var precio = 0;
var helado = 1.90;

if (topping == "oreo") {
    precio = 1;
} else if (topping == "kitkat") {
    precio = 1.50;
} else if (topping == "brownie") {
    precio = 0.75;
} else if (topping == "lacasitos") {
    precio = 0.95;
} else {
    document.write("<p>No tenemos ese topping</p>");
    precio = 0;
}

document.write("<p>Total: " + (helado + precio) + " €</p>");


document.write("<h2>Helados con switch</h2>");

var topping2 = prompt("Elige topping");
var precio2 = 0;
var helado2 = 1.90;

switch (topping2) {
    case "oreo":
        precio2 = 1;
        break;
    case "kitkat":
        precio2 = 1.50;
        break;
    case "brownie":
        precio2 = 0.75;
        break;
    case "lacasitos":
        precio2 = 0.95;
        break;
    default:
        document.write("<p>No tenemos ese topping</p>");
        precio2 = 0;
}

document.write("<p>Total: " + (helado2 + precio2) + " €</p>");

</script>

</body>
</html>
