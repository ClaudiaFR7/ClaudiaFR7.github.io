 <!DOCTYPE html>
    <html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Ejercicio 08 — else if y switch</title>
    </head>
    <body>

        <h1>Ejercicio 08 — Estructuras condicionales else if y switch</h1>
        <p>En este ejercicio se trabaja con decisiones múltiples, corrección de errores de sintaxis y comparación entre else if y switch.</p>

        <script>

var culpable = window.prompt("¿has suspendido digitalización?"); // si, no

    if (culpable == "si") {
        document.write("<p>Seras castigado.</p>");
    } else if (culpable == "no") {
        document.write("<p>Felicidades.</p>");
    } else {
        document.write("<p>Deberías haber constestado.</p>");
    }
let valor = null;

if (valor === null) { 
    alert("El valor es nulo."); 
} else { 
    alert("El valor no es nulo."); 
}
         let num = parseInt(prompt("Ingresa un número:"));

if (num > 0 && num % 2 === 0) { 
    console.log("El número es positivo y par.");
} 
else if (num > 0 && num % 2 !== 0) { 
    console.log("El número es positivo y impar.");
} 
else { 
    console.log("El número no es positivo o no es par.");
}
        </script>

    </body>
    </html>
