 <!DOCTYPE html>
    <html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Ejercicio 08 — else if y switch</title>
    </head>
    <body>

        <h1>Ejercicio 08 — Estructuras condicionales else if y switch</h1>
        <p>En este ejercicio se trabaja con decisiones múltiples, corrección de errores de sintaxis y comparación entre else if y switch.</p>

        <script>

var culpable = window.prompt("¿eres culpable?"); // si, no

    if (culpable == "si") {
        document.write("<p>Irás a la cárcel.</p>");
    } else if (culpable == "no") {
        document.write("<p>Irás a casa.</p>");
    } else {
        document.write("<p>La documentación por favor.</p>");
    }

        </script>

    </body>
    </html>
