<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 08 — else if y switch</title>
</head>
<body>

<script>

//Parte 1
let respuesta = prompt("¿Has hecho los deberes? (Debes contestar Si o No)");

if (respuesta == "Si") {
    document.write("<p>Muy bien.</p>");
} else if (respuesta == "No") {
    document.write("<p>Deberías hacerlos.</p>");
} else {
    document.write("<p>Responde bien.</p>");
}


//EJERCICIO 1
let numero = prompt("Ingresa un número:");

if (numero > 0) {alert("El número es positivo");} 
else if (numero < 0) {alert("El número es negativoegativo");} 
else {alert("El número es cero");}


// EJERCICIO 2
let contraseña = prompt("Ingresa tu contraseña (la respuesta correcta sería "secreto123"):");

if (contraseña === "secreto123") {document.write("<p>Contraseña correcta. Bienvenido!</p>");} 
else {document.write("<p>Contraseña incorrecta</p>");}


// EJERCICIO 3
let valor = null;

if (valor === null) {alert("El valor es nulo");} 
else {alert("El valor no es nulo");}

// EJERCICIO 4
let num = parseInt(prompt("Ingresa un número:"));

if (num > 0 && num % 2 === 0) {
    console.log("Positivo y par");
} else if (num > 0 && num % 2 !== 0) {
    console.log("Positivo e impar");
} else {
    console.log("Otro caso");
}


// HELADOS (ELSE IF)
var topping = prompt("Topping: oreo, kitkat, brownie, lacasitos");
var precio = 0;
var helado = 1.90;

if (topping == "oreo") {
    precio = 1;
} else if (topping == "kitkat") {
    precio = 1.50;
} else if (topping == "brownie") {
    precio = 0.75;
} else if (topping == "lacasitos") {
    precio = 0.95;
} else {
    document.write("<p>No hay ese topping</p>");
    precio = 0;
}

document.write("<p>Total: " + (helado + precio) + " €</p>");


// HELADOS (SWITCH)
var topping2 = prompt("Elige topping");
var precio2 = 0;
var helado2 = 1.90;

switch (topping2) {
    case "oreo":
        precio2 = 1;
        break;
    case "kitkat":
        precio2 = 1.50;
        break;
    case "brownie":
        precio2 = 0.75;
        break;
    case "lacasitos":
        precio2 = 0.95;
        break;
    default:
        document.write("<p>No hay ese topping</p>");
        precio2 = 0;
}

document.write("<p>Total: " + (helado2 + precio2) + " €</p>");

</script>

</body>
</html>
