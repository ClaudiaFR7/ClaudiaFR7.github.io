<html> 

<head> 

<title>Área rectángulo</title> 
</head> 
<body> 
<script> 

  //DEFINO VARIABLES// 

 let lado_1; 
let lado_2; 
 let arearectangulo; 

  

  //PIDO VALORES AL USUSARIO// 

lado_1=prompt("Dame un valor cualquiera para el lado del rectángulo"); 

lado_2=prompt("Dame otro valor cualquiera para el lado del rectángulo"); 

  

  //COMBIERTO EN FLOAT// 

 lado_1=parseFloat(lado_1); 
 lado_2=parseFloat(lado_2);

  

  //HAGO LA OPERACION QUE ME DA LA GANA// 

arearectangulo=lado_1*lado_2

  

 alert("El resultado del área del rectángulo es: " + arearectangulo); 

document.write("<h1>El resultado del área del rectángulo es: " + arearectangulo + "</h1>");

</script>
</body> 

</html>
