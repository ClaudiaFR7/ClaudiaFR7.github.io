 let radio;

  //COMBIERTO EN FLOAT// 

 radio=parseFloat(radio); 


  

  //HAGO LA OPERACION QUE ME DA LA GANA// 

areacirculo=pi*radio*radio

  

 alert("El resultado del área de la circunferencia es: " + areacirculo);
